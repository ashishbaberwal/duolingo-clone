services:
  - type: web
    name: lingotrail-api
    runtime: docker
    plan: starter
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DATABASE_URL
        value: sqlite:////var/data/lingotrail.db
      - key: DATABASE_ECHO
        value: "false"
      - key: DEFAULT_LEARNER_USERNAME
        value: learner
      - key: DEMO_LEARNER_PASSWORD
        value: LingoTrail@123
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: AUTH_COOKIE_NAME
        value: lingotrail_session
      - key: AUTH_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: AUTH_ISSUER
        value: lingotrail-api
      - key: AUTH_AUDIENCE
        value: lingotrail-web
    disk:
      name: lingotrail-data
      mountPath: /var/data
      sizeGB: 1
