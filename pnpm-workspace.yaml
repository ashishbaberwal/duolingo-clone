packages:
  - "frontend"
  - "backend"
  - "packages/*"

confirmModulesPurge: false

allowBuilds:
  sharp: true
  unrs-resolver: true

overrides:
  postcss@<8.5.10: ^8.5.10
  postcss@<=8.5.11: ^8.5.12
  postcss@<=8.5.17: ^8.5.18
  sharp@<0.35.0: ^0.35.0

minimumReleaseAgeExclude:
  - postcss@8.5.10 || 8.5.12 || 8.5.18
  - sharp@0.35.0
