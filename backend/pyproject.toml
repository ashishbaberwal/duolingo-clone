[project]
name = "duolingo-clone-api"
version = "0.1.0"
description = "FastAPI backend for the LingoTrail learning experience."
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16",
  "email-validator>=2.2",
  "fastapi>=0.116",
  "pwdlib[argon2]>=0.3.0",
  "pydantic-settings>=2.10",
  "pyjwt>=2.13.0",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "mypy>=1.16",
  "pytest>=8.4",
  "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
